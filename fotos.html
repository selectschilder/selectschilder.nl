    <script language="javascript">
      function openMapWindow(lon, lat) {
        var map_url =
          "http://map.jetphotosoft.com/gmap/map_pointer/?lon=" +
          lon +
          "&lat=" +
          lat +
          "&width=480&height=480&maptypebuttons=1&maptype=3&mapzoomcontrol=1";
        window.open(
          map_url,
          "_blank",
          "width=480,height=480,toolbar=no,status=no,menubar=no,scrollbars=no,resizable=no,location=no"
        );
      }
    </script>
